# =====================================================================
# ActivaUC · configuración de Supabase CLI
# ---------------------------------------------------------------------
# Este archivo controla el entorno LOCAL (`supabase start`) y los
# valores que `supabase link` + `supabase db push` replican donde
# corresponde. No contiene secretos: las credenciales se cargan con
# `supabase secrets set` (ver docs/CONFIGURACION_SUPABASE.md).
# =====================================================================

project_id = "activauc"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

# Captura de correos en local (confirmación de cuenta, recuperación).
[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "env(SUPABASE_AUTH_SITE_URL)"
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5173/auth/callback",
  "http://localhost:5173/restablecer-contrasena",
  "http://localhost:5173/calendar/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# REQ-1 / REQ-6: la cuenta se activa por correo y la contraseña se
# restablece mediante enlace enviado al correo registrado.
enable_confirmations = true
secure_password_change = true

[auth.email.template.confirmation]
subject = "Confirma tu cuenta en ActivaUC"

[auth.email.template.recovery]
subject = "Restablece tu contraseña de ActivaUC"

[auth.sessions]
# Caducidad de sesión inactiva: el frontend muestra "sesión expirada".
inactivity_timeout = "72h"

[edge_runtime]
enabled = true
policy = "oneshot"

# ---------------------------------------------------------------------
# Edge Functions
# verify_jwt = true  → requieren usuario autenticado
# verify_jwt = false → endpoints públicos que validan por su cuenta
#                      (state firmado de OAuth, firma de Twilio,
#                       encabezado x-cron-secret)
# ---------------------------------------------------------------------
[functions.google-oauth-start]
verify_jwt = true

[functions.google-oauth-callback]
verify_jwt = false

[functions.google-calendar-disconnect]
verify_jwt = true

[functions.process-calendar-jobs]
verify_jwt = false

[functions.process-notification-jobs]
verify_jwt = false

[functions.twilio-status-webhook]
verify_jwt = false

[functions.cron-dispatch]
verify_jwt = false
