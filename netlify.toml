# =====================================================================
# ActivaUC · configuración de Netlify
# ---------------------------------------------------------------------
# Sólo tiene efecto si conectas el REPOSITORIO a Netlify. Si arrastras
# la carpeta dist/ a netlify.com/drop, Netlify no ve este archivo: en
# ese caso lo que manda es public/_redirects, que Vite copia a dist/.
# =====================================================================

[build]
  command = "npm run build"
  publish = "dist"

  # Netlify cobra por despliegue, no por tráfico: 15 créditos cada uno
  # de los 300 mensuales, mientras el ancho de banda apenas cuenta. Este
  # script cancela el build cuando el commit no toca nada que acabe en
  # lo publicado —documentación, SQL, scripts, Edge Functions— que es la
  # mayoría. Ojo con la semántica: salir con 0 CANCELA, con 1 compila.
  ignore = "bash ./scripts/netlify-ignore.sh"

[build.environment]
  # package.json exige >=20.19. Se fija en lugar de confiar en el valor
  # por omisión de Netlify, que cambia con el tiempo y podría quedar por
  # debajo sin avisar.
  NODE_VERSION = "22"

# ---------------------------------------------------------------------
# LO QUE NO VA AQUÍ, y hay que poner a mano en Netlify
# ---------------------------------------------------------------------
# .env está en .gitignore, así que una compilación desde el repositorio
# no tiene las variables del frontend. Hay que definirlas en
# Site configuration → Environment variables:
#
#   VITE_SUPABASE_URL        https://<ref>.supabase.co
#   VITE_SUPABASE_ANON_KEY   la clave anon (pública) del proyecto
#   VITE_DATA_MODE           supabase
#
# VITE_APP_URL se deja SIN DEFINIR a propósito: así la aplicación usa el
# origen desde el que se la sirve, y el mismo build vale para el dominio
# de producción y para las vistas previas de cada rama.
#
# Sin esas variables la compilación no falla, pero el sitio publicado
# muestra un aviso de configuración en lugar de funcionar. No muestra
# datos de ejemplo: src/lib/env.ts rechaza el modo mock en producción a
# propósito, para que una demo no pueda pasar por un sistema real.
# ---------------------------------------------------------------------

# Misma regla que public/_redirects, para el despliegue desde el
# repositorio. Ver allí el porqué del 200.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeceras que no pueden romper nada y cierran lo evidente.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Una Content-Security-Policy sería la siguiente capa, pero mal ajustada
# deja el sitio en blanco, así que va comentada y SIN verificar. Si la
# activas, comprueba el inicio de sesión y la conexión con Google antes
# de darla por buena, y mira la consola del navegador.
#
#   Content-Security-Policy = "default-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'"

# Los activos compilados llevan huella en el nombre, así que se pueden
# cachear indefinidamente. index.html NO: es el que apunta a ellos.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
